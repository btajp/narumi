[project]
name = "narumi"
version = "0.1.2"
description = "narumi pipeline: recording bundle, transcription, alignment, minutes generation, export"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "click>=8.1",
]

[project.optional-dependencies]
whisper-mlx = ["mlx-whisper>=0.4"]
whisper-faster = ["faster-whisper>=1.1"]
pyannote = ["pyannote.audio>=3.3", "torch>=2.4", "torchaudio>=2.4"]
claude = ["claude-agent-sdk>=0.1"]
anthropic = ["anthropic>=0.40"]
html = ["markdown>=3.7"]
slides = ["pillow>=10"]

[project.scripts]
narumi-dev = "narumi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narumi"]
