[project]
name = "narumi-server"
version = "0.1.1"
description = "narumi MCP server: contract-driven tool registration over stdio / Streamable HTTP"
requires-python = ">=3.12"
dependencies = [
  "narumi",
  "mcp>=2.0,<3",
  "jsonschema>=4.23",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "anyio>=4.5",
]

[project.scripts]
narumi = "narumi_server.cli_tools:main"
narumi-server = "narumi_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narumi_server"]
